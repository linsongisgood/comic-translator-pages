  <h1>漫译无界 · 技术支持</h1>
  <p>漫译无界用于导入漫画图片、PDF 或文件夹，并在设备上完成识别、翻译、排版和阅读。</p>
  <h2>常见问题</h2>
  <p><strong>如何导入？</strong>在书架右上角选择“导入翻译”，再选择图片、PDF 或文件夹。</p>
  <p><strong>免费额度如何计算？</strong>首次可免费翻译 5 个独立项目；图片、文件和文件夹分别计为一个项目。</p>
  <p><strong>如何删除内容？</strong>可在 App 书架中删除作品及其翻译文件。</p>
  <h2>联系支持</h2>
  <p>请通过 <a href="https://github.com/linsongisgood/xcode/issues/new/choose">GitHub Issues</a> 提交问题。请说明设备型号、系统版本、App 版本以及复现步骤；请勿上传未获授权的漫画内容或敏感个人信息。</p>
